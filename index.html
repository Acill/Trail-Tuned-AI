<!DOCTYPE html>
<html lang="en" class="h-full bg-[#090d16] text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrailTuned AI - On-Device MTB Suspension Tuning</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        },
                        darkbg: '#090d16',
                        cardbg: '#0f172a',
                        cardborder: '#1e293b'
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Alpine.js (Defer) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d16; }
        [x-cloak] { display: none !important; }
        
        /* Rendered Markdown Output Styling */
        .markdown-output h1, .markdown-output h2, .markdown-output h3 {
            font-weight: 700;
            color: #f97316;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .markdown-output h1 { font-size: 1.5rem; }
        .markdown-output h2 { font-size: 1.25rem; }
        .markdown-output h3 { font-size: 1.125rem; }
        .markdown-output p { margin-bottom: 0.75rem; color: #cbd5e1; line-height: 1.6; font-size: 0.95rem; }
        .markdown-output ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-output li { margin-bottom: 0.25rem; font-size: 0.9rem; }
        .markdown-output strong { color: #f8fafc; font-weight: 600; }
        
        /* Styled Dark Tables */
        .markdown-output table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1.25rem 0;
            background-color: #0f172a;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .markdown-output th {
            background-color: #1e293b;
            color: #f97316;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 2px solid #334155;
        }
        .markdown-output td {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #e2e8f0;
            border-bottom: 1px solid #1e293b;
        }
        .markdown-output tr:nth-child(even) td {
            background-color: rgba(15, 23, 42, 0.6);
        }
        .markdown-output tr:nth-child(odd) td {
            background-color: rgba(30, 41, 59, 0.3);
        }
        .markdown-output tr:last-child td {
            border-bottom: none;
        }
        .markdown-output td:first-child {
            font-weight: 600;
            color: #38bdf8;
        }
    </style>
</head>
<body class="h-full bg-[#090d16] text-slate-100 flex flex-col" x-data="trailTunedApp()" x-init="initApp()">

    <!-- Navigation Header -->
    <header class="border-b border-slate-800/80 bg-[#090d16]/90 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-amber-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-person-biking text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-2">
                        TrailTuned <span class="bg-brand-500/10 text-brand-500 text-xs px-2 py-0.5 rounded-full border border-brand-500/30">WebLLM On-Device</span>
                    </h1>
                    <p class="text-xs text-slate-400">Client-Side AI MTB & e-MTB Setup Tuner</p>
                </div>
            </div>

            <!-- Model Status & Saved Setups -->
            <div class="flex items-center gap-3">
                <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs">
                    <div class="w-2 h-2 rounded-full" :class="llmLoaded ? 'bg-emerald-500 animate-pulse' : (llmLoading ? 'bg-amber-500 animate-ping' : 'bg-slate-500')"></div>
                    <span class="text-slate-300" x-text="llmStatusText">LLM Engine Ready</span>
                </div>

                <button @click="showSavedModal = true" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs sm:text-sm font-medium transition flex items-center gap-2 border border-slate-800">
                    <i class="fa-solid fa-bookmark text-brand-500"></i>
                    <span class="hidden sm:inline">Saved Setups</span>
                    <span class="bg-slate-800 text-slate-300 text-xs px-1.5 py-0.5 rounded-full" x-text="savedSetups.length">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Presets & Component Setup Form -->
        <section class="lg:col-span-5 space-y-5">
            
            <!-- Quick Bike Presets Selector -->
            <div class="bg-[#0f172a] rounded-2xl p-4 sm:p-5 border border-slate-800 shadow-xl">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-brand-500"></i> Modern Bike Presets
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <template x-for="(preset, key) in presets" :key="key">
                        <button 
                            @click="loadPreset(key)"
                            :class="selectedPreset === key ? 'border-brand-500 bg-brand-500/10 text-white' : 'border-slate-800/80 bg-slate-950/60 text-slate-400 hover:border-slate-700 hover:text-slate-200'"
                            class="p-2.5 rounded-xl border text-left text-xs font-medium transition flex flex-col justify-between h-16">
                            <span class="font-bold text-slate-200 truncate" x-text="preset.bikeModel"></span>
                            <span class="text-[10px] text-slate-400 truncate" x-text="preset.ridingStyle"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Detailed Setup Form -->
            <div class="bg-[#0f172a] rounded-2xl p-4 sm:p-5 border border-slate-800 shadow-xl space-y-4">
                <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
                    <h2 class="font-bold text-base text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-brand-500"></i> Bike & Rider Setup Profile
                    </h2>
                    <button @click="resetForm()" class="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1">
                        <i class="fa-solid fa-rotate-left"></i> Reset
                    </button>
                </div>

                <!-- Rider Info -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Rider Weight in Gear</label>
                        <div class="flex">
                            <input type="number" x-model.number="form.weight" class="w-full bg-[#090d16] border border-slate-800 rounded-l-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                            <select x-model="form.unit" class="bg-slate-900 border border-l-0 border-slate-800 rounded-r-lg px-2 text-xs text-slate-300">
                                <option value="lbs">lbs</option>
                                <option value="kg">kg</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Riding Style</label>
                        <select x-model="form.ridingStyle" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                            <option value="Trail / All-Mountain">Trail / All-Mountain</option>
                            <option value="Enduro / Aggressive">Enduro / Aggressive</option>
                            <option value="XC / Marathon">XC / Marathon</option>
                            <option value="Downhill / Bikepark">Downhill / Bikepark</option>
                            <option value="e-MTB Technical">e-MTB Technical</option>
                        </select>
                    </div>
                </div>

                <!-- Bike Specs -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Brand & Model / Year</label>
                        <input type="text" x-model="form.bikeModel" placeholder="e.g. Trek Fuel EX 9.8 2026" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Bike Chassis Type</label>
                        <select x-model="form.bikeType" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                            <option value="Full Suspension Acoustic">Full Suspension</option>
                            <option value="e-MTB (Full Power)">e-MTB (Full Power)</option>
                            <option value="e-MTB (Lightweight)">e-MTB (Lightweight)</option>
                            <option value="Hardtail">Hardtail</option>
                        </select>
                    </div>
                </div>

                <!-- Suspension Components -->
                <div class="space-y-3 pt-2 border-t border-slate-800/80">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Suspension Hardware</span>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Front Fork Spec</label>
                            <input type="text" x-model="form.fork" placeholder="e.g. Fox 36 Grip2 160mm" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Current Fork PSI / Spring</label>
                            <input type="number" x-model.number="form.forkPSI" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Rear Shock Spec</label>
                            <input type="text" x-model="form.shock" placeholder="e.g. Fox Float X2 Factory" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Current Shock PSI / Spring</label>
                            <input type="number" x-model.number="form.shockPSI" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                    </div>
                </div>

                <!-- Wheels, Tires, Components -->
                <div class="space-y-3 pt-2 border-t border-slate-800/80">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Tires, Wheels & Drivetrain</span>
                    
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Tire Specs (e.g. Schwalbe Radial, Maxxis Assegai)</label>
                        <input type="text" x-model="form.tires" placeholder="e.g. Schwalbe Albert Radial 2.5 Trail" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Front Tire PSI</label>
                            <input type="number" x-model.number="form.frontTirePSI" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Rear Tire PSI</label>
                            <input type="number" x-model.number="form.rearTirePSI" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Brakes Spec</label>
                            <input type="text" x-model="form.brakes" placeholder="e.g. SRAM Maven Bronze 200mm" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Drivetrain Spec</label>
                            <input type="text" x-model="form.drivetrain" placeholder="e.g. SRAM GX Transmission" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                        </div>
                    </div>
                </div>

                <!-- Location & Issues -->
                <div class="space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Trail Location & Conditions</span>
                        <button @click="detectLocation()" type="button" class="text-[10px] text-brand-500 hover:text-brand-400 font-medium flex items-center gap-1">
                            <i class="fa-solid fa-location-crosshairs" :class="{'fa-spin': isLocating}"></i>
                            <span x-text="isLocating ? 'Detecting...' : 'GPS Auto-Detect'"></span>
                        </button>
                    </div>

                    <div>
                        <input type="text" x-model="form.location" placeholder="e.g. Whistler / Loose over hardpack, steep roots" class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white">
                    </div>
                    
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Rider Feedback / Setup Issues</label>
                        <textarea x-model="form.notes" rows="2" placeholder="e.g. Harsh on small bumps, rear ends packs down on fast chatter..." class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-white resize-none"></textarea>
                    </div>
                </div>

                <!-- Run AI Tuning Action -->
                <button 
                    @click="generateTuningRecommendation()" 
                    :disabled="isGenerating"
                    class="w-full py-3 px-4 bg-gradient-to-r from-brand-500 to-amber-600 hover:from-brand-600 hover:to-amber-700 text-white font-bold rounded-xl shadow-lg shadow-brand-500/20 transition flex items-center justify-center gap-2 disabled:opacity-50 mt-2">
                    <template x-if="!isGenerating">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Calculate AI Tune Recommendation
                        </span>
                    </template>
                    <template x-if="isGenerating">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-circle-notch fa-spin"></i> Processing Tune Engine...
                        </span>
                    </template>
                </button>

            </div>
        </section>

        <!-- Right Column: AI Advice Output & Interactive Follow-up -->
        <section class="lg:col-span-7 flex flex-col space-y-6">
            
            <!-- Output Container -->
            <div class="bg-[#0f172a] rounded-2xl border border-slate-800 shadow-xl flex-1 flex flex-col overflow-hidden min-h-[550px]">
                
                <!-- Output Header -->
                <div class="bg-[#090d16] px-6 py-4 border-b border-slate-800/80 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-table-cells text-brand-500"></i>
                        <h2 class="font-bold text-slate-200">AI Setup Recommendation Matrix</h2>
                    </div>
                    <template x-if="aiMarkdownResponse">
                        <button @click="saveCurrentSetup()" class="text-xs text-brand-500 hover:text-brand-400 font-semibold bg-brand-500/10 px-3 py-1.5 rounded-lg border border-brand-500/30 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-floppy-disk"></i> Save Setup
                        </button>
                    </template>
                </div>

                <!-- WebLLM Engine Loading Progress Bar -->
                <template x-if="llmLoading">
                    <div class="bg-slate-900 border-b border-slate-800 p-4 space-y-2">
                        <div class="flex justify-between text-xs text-slate-400 font-medium">
                            <span><i class="fa-solid fa-download text-brand-500 mr-1"></i> Initializing On-Device AI Model (WebGPU)...</span>
                            <span x-text="llmProgressText"></span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-brand-500 to-amber-500 h-full transition-all duration-300" :style="`width: ${llmProgressPercent}%`"></div>
                        </div>
                    </div>
                </template>

                <!-- Output Body / Empty State -->
                <div class="p-6 flex-1 overflow-y-auto">
                    
                    <!-- Empty State -->
                    <template x-if="!aiMarkdownResponse && !isGenerating">
                        <div class="h-full flex flex-col items-center justify-center text-center p-8 text-slate-500">
                            <div class="w-16 h-16 rounded-2xl bg-slate-900 flex items-center justify-center text-2xl text-slate-400 mb-4 border border-slate-800 shadow-inner">
                                <i class="fa-solid fa-chart-diagram text-brand-500"></i>
                            </div>
                            <h3 class="text-slate-200 font-semibold mb-1">Awaiting Setup Parameters</h3>
                            <p class="text-sm text-slate-400 max-w-sm">Choose a preset or enter your bike specs, then click <strong>Calculate AI Tune Recommendation</strong> to generate your tuning matrix.</p>
                        </div>
                    </template>

                    <!-- Processing Progress State -->
                    <template x-if="isGenerating && !aiMarkdownResponse">
                        <div class="h-full flex flex-col items-center justify-center text-center p-8 text-slate-400 space-y-4">
                            <div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                            <p class="text-sm font-medium text-slate-300">Calculating leverage rates, spring stiffness, clicker balances, and tire PSI...</p>
                        </div>
                    </template>

                    <!-- Markdown & Table Rendered View -->
                    <template x-if="aiMarkdownResponse">
                        <div class="markdown-output" x-html="renderedHTML"></div>
                    </template>

                </div>

                <!-- Chat / Fine-Tune Input Bar -->
                <div class="p-4 bg-[#090d16] border-t border-slate-800">
                    <form @submit.prevent="sendFollowUpQuery()" class="flex gap-2">
                        <input 
                            type="text" 
                            x-model="followUpInput" 
                            placeholder="Ask follow-up (e.g. 'How do I reduce brake dive?' or 'Adjust for wet slick rocks')..." 
                            :disabled="isGenerating || !aiMarkdownResponse"
                            class="flex-1 bg-[#0f172a] border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-500 disabled:opacity-50">
                        <button 
                            type="submit" 
                            :disabled="isGenerating || !aiMarkdownResponse || !followUpInput.trim()" 
                            class="px-4 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl font-medium transition disabled:opacity-50 flex items-center gap-2 text-xs sm:text-sm">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>

            </div>

        </section>

    </main>

    <!-- Saved Setups Modal -->
    <div x-show="showSavedModal" class="fixed inset-0 z-50 bg-[#090d16]/80 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
        <div @click.away="showSavedModal = false" class="bg-[#0f172a] border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-bookmark text-brand-500"></i> Saved Bike Setups
                </h3>
                <button @click="showSavedModal = false" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-3 flex-1">
                <template x-if="savedSetups.length === 0">
                    <p class="text-slate-500 text-center py-8 text-sm">No saved setups found. Click "Save Setup" after calculating a recommendation!</p>
                </template>
                
                <template x-for="(setup, index) in savedSetups" :key="index">
                    <div class="bg-[#090d16] border border-slate-800/80 p-4 rounded-xl flex justify-between items-start gap-4">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-200" x-text="setup.bikeModel"></span>
                                <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full" x-text="setup.date"></span>
                            </div>
                            <p class="text-xs text-slate-400" x-text="`Rider: ${setup.weight}${setup.unit} | Style: ${setup.ridingStyle}`"></p>
                            <p class="text-xs text-slate-500" x-text="`Fork: ${setup.forkPSI} PSI | Shock: ${setup.shockPSI} PSI`"></p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="loadSavedSetup(setup)" class="px-3 py-1.5 bg-brand-500/10 hover:bg-brand-500/20 text-brand-500 border border-brand-500/30 rounded-lg text-xs font-semibold transition">
                                Load
                            </button>
                            <button @click="deleteSavedSetup(index)" class="p-1.5 text-slate-500 hover:text-red-400 transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function trailTunedApp() {
            return {
                isGenerating: false,
                isLocating: false,
                showSavedModal: false,
                selectedPreset: 'tazer2027',
                aiMarkdownResponse: '',
                renderedHTML: '',
                followUpInput: '',
                chatHistory: [],
                savedSetups: [],

                // WebLLM State
                webLLMEngine: null,
                llmLoading: false,
                llmLoaded: false,
                llmProgressPercent: 0,
                llmProgressText: '0%',
                llmStatusText: 'Initializing...',

                // Presets
                presets: {
                    tazer2027: {
                        bikeModel: '2027 Intense Tazer MX e-MTB',
                        bikeType: 'e-MTB (Full Power)',
                        weight: 185,
                        unit: 'lbs',
                        ridingStyle: 'e-MTB Technical',
                        fork: 'Öhlins DH38 Race / 170mm',
                        forkPSI: 76,
                        shock: 'Öhlins TTX22M Coil 155mm',
                        shockPSI: 450,
                        tires: 'Schwalbe Albert Radial 2.5 Trail',
                        frontTirePSI: 24,
                        rearTirePSI: 27,
                        brakes: 'SRAM Maven Ultimate 220mm',
                        drivetrain: 'SRAM XX Eagle Transmission',
                        location: 'Rocky Steep Technical Trails',
                        notes: 'Squatting under acceleration, slight high-speed chatter on brake bumps.'
                    },
                    kenevo: {
                        bikeModel: 'Specialized Kenevo SL Expert',
                        bikeType: 'e-MTB (Lightweight)',
                        weight: 175,
                        unit: 'lbs',
                        ridingStyle: 'Enduro / Aggressive',
                        fork: 'Fox Float 38 Performance Elite 170mm',
                        forkPSI: 88,
                        shock: 'Fox Float X Performance Elite',
                        shockPSI: 195,
                        tires: 'Maxxis Assegai 2.5 EXO+ / Minion DHR II 2.4',
                        frontTirePSI: 22,
                        rearTirePSI: 25,
                        brakes: 'SRAM Code RSC 200mm',
                        drivetrain: 'SRAM GX Eagle AXS',
                        location: 'Steep Loamy Pacific Northwest Chutes',
                        notes: 'Wants maximum cornering traction on wet roots without fork diving in drops.'
                    },
                    fuel: {
                        bikeModel: 'Trek Fuel EX 9.8 Gen 6',
                        bikeType: 'Full Suspension Acoustic',
                        weight: 165,
                        unit: 'lbs',
                        ridingStyle: 'Trail / All-Mountain',
                        fork: 'Fox Rhythm 36 Float 150mm',
                        forkPSI: 78,
                        shock: 'Fox Performance Float X 140mm',
                        shockPSI: 180,
                        tires: 'Bontrager SE5 Team Issue 2.4',
                        frontTirePSI: 21,
                        rearTirePSI: 23,
                        brakes: 'SRAM DB8 4-Piston',
                        drivetrain: 'SRAM GX Eagle 12sp',
                        location: 'Flow Trails & High-Speed Singletrack',
                        notes: 'Feels lively, but want smoother mid-stroke support through berms.'
                    },
                    tracer: {
                        bikeModel: 'Intense Tracer 279 Enduro',
                        bikeType: 'Full Suspension Acoustic',
                        weight: 180,
                        unit: 'lbs',
                        ridingStyle: 'Enduro / Aggressive',
                        fork: 'RockShox Zeb Ultimate Charger 3 170mm',
                        forkPSI: 68,
                        shock: 'RockShox Super Deluxe Ultimate Coil',
                        shockPSI: 400,
                        tires: 'Continental Kryptotal Fr/Re Enduro',
                        frontTirePSI: 23,
                        rearTirePSI: 26,
                        brakes: 'Magura MT7 HC 203mm',
                        drivetrain: 'Shimano XT M8100 12sp',
                        location: 'Bike Park & Chunky Downhill Rocks',
                        notes: 'Harsh bottom-outs on 6-foot drops, needs more progression.'
                    }
                },

                // Current Form Model
                form: {
                    bikeModel: '2027 Intense Tazer MX e-MTB',
                    bikeType: 'e-MTB (Full Power)',
                    weight: 185,
                    unit: 'lbs',
                    ridingStyle: 'e-MTB Technical',
                    fork: 'Öhlins DH38 Race / 170mm',
                    forkPSI: 76,
                    shock: 'Öhlins TTX22M Coil 155mm',
                    shockPSI: 450,
                    tires: 'Schwalbe Albert Radial 2.5 Trail',
                    frontTirePSI: 24,
                    rearTirePSI: 27,
                    brakes: 'SRAM Maven Ultimate 220mm',
                    drivetrain: 'SRAM XX Eagle Transmission',
                    location: 'Rocky Steep Technical Trails',
                    notes: 'Squatting under acceleration, slight high-speed chatter on brake bumps.'
                },

                initApp() {
                    // Configure Marked markdown parser
                    if (window.marked) {
                        marked.setOptions({
                            gfm: true,
                            breaks: true
                        });
                    }

                    // Load saved setups from localStorage
                    const saved = localStorage.getItem('trailtuned_saved_setups_v2');
                    if (saved) {
                        try {
                            this.savedSetups = JSON.parse(saved);
                        } catch (e) {
                            console.error('Failed to parse saved setups', e);
                        }
                    }

                    // Initialize WebLLM engine asynchronously
                    this.initWebLLM();
                },

                async initWebLLM() {
                    this.llmStatusText = "Checking WebGPU...";
                    
                    // Verify WebGPU Availability
                    if (!navigator.gpu) {
                        this.llmStatusText = "Rule Engine Active (No WebGPU)";
                        return;
                    }

                    try {
                        // Dynamically load WebLLM ESM module
                        const webllm = await import('https://esm.run/@mlc-ai/web-llm');
                        this.llmLoading = true;
                        this.llmStatusText = "Downloading WebLLM Model...";

                        const selectedModel = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

                        this.webLLMEngine = await webllm.CreateMLCEngine(
                            selectedModel,
                            {
                                initProgressCallback: (progress) => {
                                    this.llmProgressPercent = Math.round(progress.progress * 100);
                                    this.llmProgressText = `${this.llmProgressPercent}%`;
                                    this.llmStatusText = progress.text.substring(0, 30) + "...";
                                }
                            }
                        );

                        this.llmLoaded = true;
                        this.llmLoading = false;
                        this.llmStatusText = "On-Device AI Ready";
                    } catch (err) {
                        console.warn("WebLLM initialization skipped or failed, using built-in rule engine:", err);
                        this.llmLoading = false;
                        this.llmLoaded = false;
                        this.llmStatusText = "Tuning Rule Engine Active";
                    }
                },

                loadPreset(key) {
                    this.selectedPreset = key;
                    const p = this.presets[key];
                    if (p) {
                        this.form = JSON.parse(JSON.stringify(p));
                    }
                },

                resetForm() {
                    this.selectedPreset = null;
                    this.form = {
                        bikeModel: '',
                        bikeType: 'Full Suspension Acoustic',
                        weight: 170,
                        unit: 'lbs',
                        ridingStyle: 'Trail / All-Mountain',
                        fork: '',
                        forkPSI: 70,
                        shock: '',
                        shockPSI: 160,
                        tires: '',
                        frontTirePSI: 22,
                        rearTirePSI: 25,
                        brakes: '',
                        drivetrain: '',
                        location: '',
                        notes: ''
                    };
                },

                // Geolocation + OpenStreetMap Reverse Geocoding
                detectLocation() {
                    if (!navigator.geolocation) {
                        alert("Geolocation is not supported by your browser.");
                        return;
                    }
                    this.isLocating = true;
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            
                            try {
                                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                                const data = await response.json();
                                const place = data.address?.county || data.address?.city || data.address?.state || "Mountain Trail";
                                this.form.location = `${place} (${lat.toFixed(2)}, ${lng.toFixed(2)}) - Hardpack & Roots`;
                            } catch (e) {
                                this.form.location = `GPS Location (${lat.toFixed(2)}, ${lng.toFixed(2)})`;
                            } finally {
                                this.isLocating = false;
                            }
                        },
                        (error) => {
                            this.isLocating = false;
                            this.form.location = "Loose over Hardpack, Mountain Singletrack";
                        }
                    );
                },

                // Primary Setup Engine Calculation
                async generateTuningRecommendation() {
                    this.isGenerating = true;
                    this.aiMarkdownResponse = '';
                    this.chatHistory = [];

                    const promptText = `
Rider Weight: ${this.form.weight} ${this.form.unit}
Riding Style: ${this.form.ridingStyle}
Bike Specs: ${this.form.bikeModel} (${this.form.bikeType})
Front Fork: ${this.form.fork} | Current Pressure: ${this.form.forkPSI} PSI
Rear Shock: ${this.form.shock} | Current Pressure/Coil: ${this.form.shockPSI}
Tire Specs: ${this.form.tires} | Front: ${this.form.frontTirePSI} PSI | Rear: ${this.form.rearTirePSI} PSI
Brakes: ${this.form.brakes} | Drivetrain: ${this.form.drivetrain}
Trail Location & Terrain: ${this.form.location}
Rider Feedback / Issue: "${this.form.notes}"
`;

                    if (this.webLLMEngine && this.llmLoaded) {
                        try {
                            const messages = [
                                {
                                    role: "system",
                                    content: `You are TrailTuned AI, an expert mountain bike suspension setup engineer. Provide a precise tuning recommendation table using markdown syntax (| Setting | Front Fork | Rear Shock |). Output clean markdown tables and concise bullet points.`
                                },
                                {
                                    role: "user",
                                    content: `Generate a comprehensive tuning recommendation table for this setup:\n${promptText}`
                                }
                            ];

                            const reply = await this.webLLMEngine.chat.completions.create({
                                messages: messages,
                                temperature: 0.3,
                                max_tokens: 1000
                            });

                            this.aiMarkdownResponse = reply.choices[0].message.content;
                            this.chatHistory = messages;
                            this.chatHistory.push({ role: "assistant", content: this.aiMarkdownResponse });

                        } catch (err) {
                            console.warn("WebLLM execution failed, using fast rule engine:", err);
                            this.aiMarkdownResponse = this.generateRuleBasedRecommendation();
                        }
                    } else {
                        // Fast, fully reliable local tuning calculation rule engine
                        this.aiMarkdownResponse = this.generateRuleBasedRecommendation();
                    }

                    this.renderMarkdown();
                    this.isGenerating = false;
                },

                // Fast Local Fallback Rule Engine for Instant Tables
                generateRuleBasedRecommendation() {
                    const weightLbs = this.form.unit === 'kg' ? Math.round(this.form.weight * 2.20462) : this.form.weight;
                    
                    // Pressure calculations based on weight
                    const recForkPSI = Math.round(weightLbs * 0.42);
                    const recShockPSI = Math.round(weightLbs * 1.05);
                    const recFrontPSI = Math.max(18, Math.min(28, Math.round(weightLbs * 0.12)));
                    const recRearPSI = Math.max(20, Math.min(32, Math.round(weightLbs * 0.14)));

                    return `### <i class="fa-solid fa-sliders text-brand-500"></i> Recommended Setup Matrix

| Adjustment Parameter | Front Fork (${this.form.fork || 'Fork'}) | Rear Shock (${this.form.shock || 'Shock'}) |
| :--- | :--- | :--- |
| **Air Pressure / Coil Rate** | **${recForkPSI} PSI** (Current: ${this.form.forkPSI}) | **${recShockPSI} PSI / Rate** (Current: ${this.form.shockPSI}) |
| **Target Sag %** | 18% - 22% (30-35mm) | 28% - 30% (15-18mm stroke) |
| **Low-Speed Compression (LSC)** | 6 clicks out from fully closed | 8 clicks out from fully closed |
| **High-Speed Compression (HSC)** | 4 clicks out from fully closed | 3 clicks out from fully closed |
| **Low-Speed Rebound (LSR)** | 7 clicks out from fully closed | 6 clicks out from fully closed |
| **High-Speed Rebound (HSR)** | 3 clicks out from fully closed | 2 clicks out from fully closed |
| **Volume Tokens / Spacers** | 2 Volume Spacers | 1 Volume Reducer |
| **Tire Pressure** | **${recFrontPSI} PSI** (Front) | **${recRearPSI} PSI** (Rear) |

---

### <i class="fa-solid fa-lightbulb text-amber-500"></i> Key Setup Insights & Recommendations
- **Mid-Stroke & Cornering Stability:** Setting front fork sag to **20%** ensures proper front wheel traction in steep turns without diving under heavy braking from your **${this.form.brakes || 'brakes'}**.
- **Chassis Balance:** For **${this.form.bikeModel}** on **${this.form.location || 'mixed trail conditions'}**, slowing down rear rebound by 1 click reduces pedal bob during aggressive pedaling.
- **Tire Pressure Calibration:** Lowering front tire pressure to **${recFrontPSI} PSI** on **${this.form.tires || 'tubeless tires'}** maximizes dampening on small roots while preventing rim strikes.
- **Feedback Fix for Note:** *"${this.form.notes || 'General trail setup'}"* — Adding 1 click of Low-Speed Compression will support the mid-stroke and improve chassis hold-up.`;
                },

                // Markdown Renderer Execution
                renderMarkdown() {
                    if (window.marked && this.aiMarkdownResponse) {
                        this.renderedHTML = marked.parse(this.aiMarkdownResponse);
                    } else {
                        this.renderedHTML = `<pre class="whitespace-pre-wrap">${this.aiMarkdownResponse}</pre>`;
                    }
                },

                // Follow-up Chat Engine
                async sendFollowUpQuery() {
                    if (!this.followUpInput.trim() || this.isGenerating) return;

                    const query = this.followUpInput.trim();
                    this.followUpInput = '';
                    this.isGenerating = true;

                    if (this.webLLMEngine && this.llmLoaded) {
                        try {
                            this.chatHistory.push({ role: "user", content: query });
                            const reply = await this.webLLMEngine.chat.completions.create({
                                messages: this.chatHistory,
                                temperature: 0.4,
                                max_tokens: 600
                            });

                            const followUpText = reply.choices[0].message.content;
                            this.aiMarkdownResponse += `\n\n---\n\n### <i class="fa-solid fa-comments text-brand-500"></i> Mechanic Tuning Note: "${query}"\n\n${followUpText}`;
                            this.chatHistory.push({ role: "assistant", content: followUpText });
                        } catch (e) {
                            this.appendRuleFollowUp(query);
                        }
                    } else {
                        this.appendRuleFollowUp(query);
                    }

                    this.renderMarkdown();
                    this.isGenerating = false;
                },

                appendRuleFollowUp(query) {
                    this.aiMarkdownResponse += `\n\n---\n\n### <i class="fa-solid fa-wrench text-brand-500"></i> Mechanic Tuning Adjustment: "${query}"

- **Compression Adjustments:** Open Low-Speed Compression by **1-2 clicks** counter-clockwise if feeling feedback on fast chatter.
- **Rebound Calibration:** If the bike feels loose or skittery over sequential bumps, speed up rebound by **1 click**.
- **Tire Pressure Fine-Tuning:** Drop pressure by **1 PSI** for wet/slippery terrain or add **1.5 PSI** if riding rocky bike park drops.`;
                },

                // Saved Setups Persistence
                saveCurrentSetup() {
                    const setupToSave = {
                        ...this.form,
                        date: new Date().toLocaleDateString(),
                        id: Date.now()
                    };
                    this.savedSetups.unshift(setupToSave);
                    localStorage.setItem('trailtuned_saved_setups_v2', JSON.stringify(this.savedSetups));
                    alert("Setup saved to local storage!");
                },

                loadSavedSetup(setup) {
                    this.form = JSON.parse(JSON.stringify(setup));
                    this.showSavedModal = false;
                    this.selectedPreset = null;
                },

                deleteSavedSetup(index) {
                    this.savedSetups.splice(index, 1);
                    localStorage.setItem('trailtuned_saved_setups_v2', JSON.stringify(this.savedSetups));
                }
            };
        }
    </script>
